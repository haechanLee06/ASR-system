# ==========================================================
# 1. 核心配置：Tokenizer & 词表
# ==========================================================
model: Paraformer
tokenizer: SentencepiecesTokenizer
# 关键：token_list 必须在这里，用于计算 vocab_size
token_list: /18t/data/home/panyq/llm_output/paraformer_sichuan_finetune/tokens.txt

tokenizer_conf:
  bpemodel: /18t/data/home/panyq/llm_output/paraformer_sichuan_finetune/bpe.model
  # 为了双重保险，这里也放一份
  token_list: /18t/data/home/panyq/llm_output/paraformer_sichuan_finetune/tokens.txt

# ==========================================================
# 2. 模型结构：Paraformer-Large (560维/50层)
# ==========================================================
input_size: 560

# ===== Encoder =====
encoder: SANMEncoder
encoder_conf:
  output_size: 512
  attention_heads: 4
  linear_units: 2048
  num_blocks: 50
  dropout_rate: 0.1
  # use_fsmn: true  <-- 已删除，防止报错

# ===== Decoder =====
decoder: ParaformerSANMDecoder
decoder_conf:
  attention_heads: 4
  linear_units: 2048
  num_blocks: 16
  dropout_rate: 0.1
  # use_fsmn: true  <-- 已删除，防止报错

# ===== Predictor =====
predictor: CifPredictor
predictor_conf:
  idim: 512
  threshold: 1.0
  l_order: 1
  r_order: 1
  tail_threshold: 0.5
  # 废弃参数已删除

model_conf:
  ctc_weight: 0.0
  lsm_weight: 0.1
  length_normalized_loss: true
  predictor_weight: 1.0

# ==========================================================
# 3. 前端 & 数据 (关键修复区)
# ==========================================================
frontend: WavFrontend
frontend_conf:
  fs: 16000
  n_mels: 80
  frame_length: 25
  frame_shift: 10

dataset: AudioDataset
dataset_conf:
  index_ds: JsonlDataset          # 明确指定读取 Jsonl
  batch_sampler: BatchSampler
  batch_type: token
  batch_size: 20000 
  num_workers: 4
  
  # 指向刚才脚本生成的 .jsonl 文件
  train_data_set_list: 
    - /18t/data/home/panyq/llm_data/dataset/funasr_finetune/train.jsonl
  valid_data_set_list: 
    - /18t/data/home/panyq/llm_data/dataset/funasr_finetune/val.jsonl
# ==========================================================
# 4. 训练控制参数 (整合版)
# ==========================================================
train_conf:
  max_epoch: 5
  log_interval: 50
  resume: true               # 开启断点续训
  validate_interval: 2000    # 每隔多少 step 验证一次
  save_checkpoint_interval: 2000
  keep_nbest_models: 5
  avg_nbest_model: 3
  use_amp: true              # 对应原配置的 use_amp
  ignore_mismatch: true      # 关键！解决 CIF 维度不匹配报错

# ==========================================================
# 5. 优化器与调度器 (必须作为独立项或嵌套在特定字段下)
# ==========================================================
optim: adam
optim_conf:
  lr: 0.0002
  weight_decay: 0.0

scheduler: warmuplr
scheduler_conf:
  warmup_steps: 2000

# ==========================================================
# 6. 硬件与初始化
# ==========================================================
ngpu: 1
init_param: /18t/data/home/panyq/models/paraformer-large/model.pt